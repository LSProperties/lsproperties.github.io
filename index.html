<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="color-scheme" content="light dark">

<title>Rentals</title>

</head><body>
<header><h1>Rentals</h1><div class="small" id="who"></div></header>
<main>
  <section id="loading"><p class="small">Loading&hellip;</p></section>

  <section id="signin" hidden>
    <h2>Sign in</h2>
    <p class="small">Use the Google account the family uses for the rentals.</p>
    <div id="gbtn"></div>
    <p class="small" id="gNote"></p>
    <details id="codeBox"><summary>Or get a sign-in code by email</summary>
      <div class="row"><input id="email" type="email" placeholder="Your email" autocomplete="email"><button id="sendCode" type="button">Email me a code</button></div>
      <div class="row" id="codeRow" hidden><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code"><button id="useCode" type="button">Sign in</button></div>
    </details>
    <p class="msg" id="signMsg" role="status"></p>
  </section>

  <section id="home" hidden>
    <a class="tile" href="fi/"><span class="ico">&#x1F3E0;</span><span><b>Inspections</b><br><span class="small">Flat inspections, photos and reports</span></span></a>
    <a class="tile" href="tm/"><span class="ico">&#x1F465;</span><span><b>Tenancies</b><br><span class="small">Viewings, applicants, agreements and bonds</span></span></a>
    <details id="devBox"><summary>Signed-in devices</summary><div id="devices" class="small">Loading&hellip;</div></details>
    <button id="signout" class="quiet" type="button">Sign out of this phone</button>
    <p class="small" id="ver"></p>
  </section>
</main>
<script src="config.js?v=2026.10.16-a252e67"></script>
<script src="api.js?v=2026.10.16-a252e67"></script>
<script src="signin.js?v=2026.10.16-a252e67"></script>
