<!DOCTYPE html>
<html lang="en" dir="ltr" data-app="mt">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://drive.google.com https://*.googleusercontent.com; connect-src 'self' data: blob: https://script.google.com https://script.googleusercontent.com; frame-src 'self' data: blob:; media-src 'self' data: blob:; worker-src 'self'; base-uri 'none'; form-action 'none'">
<link rel="manifest" href="../manifest.webmanifest"><link rel="apple-touch-icon" href="../icon-180.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f766e">
<title>Maintenance</title>
<style>
/* Maintenance (Rentals app, area 'mt'): kept deliberately simple and large for easy use on a phone */
:root{
  --bg:#f3f7f6;--surface:#ffffff;--surface-2:#f6faf9;--text:#10201d;--muted:#5b6b67;--line:#dce7e4;
  --brand:#0f766e;--brand-soft:#ccfbf1;--bad:#c81e1e;--bad-soft:#fde8e8;--warn:#b45309;--warn-soft:#fef3c7;--ok:#15803d;--ok-soft:#dcfce7;--none:#64748b;--none-soft:#eef2f6;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b1513;--surface:#13211e;--surface-2:#182a26;--text:#e8f3f0;--muted:#9fb3ad;--line:#26413b;
  --brand-soft:#123b36;--bad:#f87171;--bad-soft:#3b1414;--warn:#fbbf24;--warn-soft:#3a2a08;--ok:#4ade80;--ok-soft:#10301c;--none:#94a3b8;--none-soft:#1e293b;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:18px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.bar{position:sticky;inset-block-start:0;z-index:5;display:flex;align-items:center;gap:10px;padding:14px 16px 16px;padding-block-start:max(14px,env(safe-area-inset-top));
  background:linear-gradient(135deg,#0d9488,#0f766e 60%,#115e59);color:#fff;border-radius:0 0 22px 22px}
.bar h1{flex:1;margin:0;font-size:1.35rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{border:0;background:rgba(255,255,255,.2);color:#fff;font-size:1.6rem;line-height:1;width:44px;height:44px;border-radius:12px;cursor:pointer;flex:none}
main{max-width:640px;margin:0 auto;padding:14px 14px calc(30px + env(safe-area-inset-bottom))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-block-end:12px}
.title{font-weight:800;font-size:1.1rem}
.small{font-size:.88rem}.muted{color:var(--muted)}
.hidden{display:none!important}
.sec{font-size:.85rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 6px 8px}
.job{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;font:inherit;color:inherit;cursor:pointer}
.job .dot{font-size:1.5rem;line-height:1.2;flex:none}
.job b{display:block;font-size:1.08rem}
.st{display:inline-block;margin-block-start:6px;padding:4px 10px;border-radius:99px;font-weight:800;font-size:.92rem}
.overdue{border-inline-start-color:var(--bad)}.overdue .st{background:var(--bad-soft);color:var(--bad)}
.due,.soon{border-inline-start-color:var(--warn)}.due .st,.soon .st{background:var(--warn-soft);color:var(--warn)}
.ok{border-inline-start-color:var(--ok)}.ok .st{background:var(--ok-soft);color:var(--ok)}
.none{border-inline-start-color:var(--none)}.none .st{background:var(--none-soft);color:var(--none)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 18px;border-radius:14px;border:2px solid var(--line);background:var(--surface);
  color:var(--text);font:inherit;font-weight:800;cursor:pointer}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.big{width:100%;min-height:68px;font-size:1.2rem}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:40px;padding:6px 12px;font-size:.9rem}
.btn:disabled{opacity:.6}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:2px solid var(--line);background:var(--surface);color:var(--text);border-radius:99px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer}
.chips button.on{background:var(--brand);border-color:var(--brand);color:#fff}
label.fld{display:block;margin-block:10px}
label.fld span{display:block;font-weight:700;margin-block-end:6px}
/* every box the same height and inner layout on iPhone (Safari styles number, date and select boxes its own way) */
input[type=text],input[type=date],input[type=number],select,textarea{display:block;width:100%;max-width:100%;margin:0;font:inherit;font-size:18px;line-height:1.3;padding:12px;border:2px solid var(--line);border-radius:12px;
  background:var(--surface-2);color:var(--text);-webkit-appearance:none;appearance:none}
input[type=text],input[type=date],input[type=number],select{height:54px}
input[type=date]{text-align:start}
input[type=date]::-webkit-date-and-time-value{text-align:start;margin:0}
textarea{min-height:80px}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:end}   /* boxes line up even when a label wraps */
.pair label.fld{margin-block:10px 0}
.switch{display:flex;align-items:center;gap:12px;margin-block:12px 4px;font-weight:700;cursor:pointer}
.switch input{width:26px;height:26px;margin:0;flex:none;accent-color:var(--brand)}
.big-status{font-size:1.25rem;font-weight:800;padding:14px;border-radius:14px;margin-block:10px}
.hist{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-block-start:1px solid var(--line)}
.hist:first-child{border:0}
.err{color:var(--bad);font-weight:700}
.toast{position:fixed;inset-inline:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:20;max-width:600px;margin:0 auto;background:#10201d;color:#fff;padding:14px 16px;border-radius:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.3);display:flex;gap:12px;align-items:center}
.toast button{margin-inline-start:auto;border:0;background:rgba(255,255,255,.18);color:#fff;font:inherit;font-weight:800;border-radius:10px;padding:8px 12px;cursor:pointer}
.spin{display:inline-block;width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:s 1s linear infinite;vertical-align:middle}
@keyframes s{to{transform:rotate(360deg)}}
.demo{background:#f59e0b;color:#111;text-align:center;font-weight:700;padding:8px;font-size:.9rem}
/* 1.2.0: the apps' look (gradient header, soft background, cards with shadows, icon tiles), still large and simple */
:root{--grad:linear-gradient(135deg,#0d9488 0%,#0891b2 45%,#4f46e5 100%);--shadow:0 1px 2px rgba(15,60,80,.06),0 8px 24px -8px rgba(15,60,80,.18);--shadow-lg:0 20px 50px -12px rgba(8,145,178,.45);--glow:0 10px 26px -8px rgba(13,148,136,.55)}
@media (prefers-color-scheme:dark){:root{--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -10px rgba(0,0,0,.7)}}
html,body{font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior-y:none}   /* no pull-to-refresh (as in the apps) */
body{min-height:100vh;background:radial-gradient(900px 500px at 110% -10%,rgba(34,211,238,.16),transparent 60%),radial-gradient(700px 500px at -20% 20%,rgba(79,70,229,.12),transparent 60%),var(--bg);background-attachment:fixed}
.bar{background:var(--grad);background-size:200% 200%;animation:shift 12s ease infinite;border-radius:0 0 26px 26px;box-shadow:var(--shadow-lg)}
@keyframes shift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.card{border-radius:22px;box-shadow:var(--shadow);animation:rise .35s cubic-bezier(.2,.8,.2,1) both}
.btn{border-radius:16px}.btn.primary{background:var(--grad);border:0;box-shadow:var(--glow)}
.hero{background:var(--grad);color:#fff;border:0;display:flex;gap:14px;align-items:center;padding:18px;box-shadow:var(--shadow-lg)}
.hero .big{font-size:1.35rem;font-weight:850;letter-spacing:-.02em;line-height:1.2}.hero .sub{opacity:.9;font-size:.95rem}
.hero .ic{flex:none;width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:1.8rem;background:rgba(255,255,255,.22)}
.job{display:flex;gap:14px;align-items:center;border:1px solid var(--line);padding:14px 14px 14px 12px}
.job .tile{flex:none;width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:1.7rem;color:#fff;box-shadow:var(--glow)}
.job.overdue .tile{background:linear-gradient(135deg,#f43f5e,#e11d48)}.job.due .tile,.job.soon .tile{background:linear-gradient(135deg,#f59e0b,#f97316)}
.job.ok .tile{background:linear-gradient(135deg,#10b981,#06b6d4)}.job.none .tile{background:linear-gradient(135deg,#94a3b8,#64748b)}
.job .txt{flex:1;min-width:0}.job .txt b{font-size:1.1rem}
.job .chev{flex:none;font-size:1.8rem;color:var(--muted);line-height:1}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-block-start:18px}
.actions .btn{min-height:64px;background:var(--surface);box-shadow:var(--shadow)}
.sync{font-size:.85rem;color:var(--muted);margin:2px 6px 10px;display:flex;gap:8px;align-items:center}
.sync .spin{width:14px;height:14px;border-width:2px}
/* 1.3.0: the bottom menu, fixed to the bottom like the apps' (the larger of the padding and the iPhone safe area) */
main{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.mttabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;
  padding:10px max(12px,calc((100% - 640px) / 2));padding-bottom:max(10px,env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--surface) 82%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);border-top:1px solid var(--line)}
.mttabs button{border:0;background:transparent;color:var(--muted);border-radius:16px;min-height:62px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font:inherit;font-size:.82rem;font-weight:800;cursor:pointer;min-width:0}
.mttabs button .ic{font-size:1.5rem;line-height:1}
.mttabs button.on{background:var(--brand-soft);color:var(--brand)}
/* 1.4.0: the New job / edit pop-up */
.modal{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;padding:12px;background:rgba(8,20,28,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.modal .box{width:100%;max-width:520px;max-height:calc(100vh - 24px - env(safe-area-inset-top));overflow:auto;background:var(--surface);border-radius:24px;padding:20px;padding-bottom:max(20px,env(safe-area-inset-bottom));box-shadow:var(--shadow-lg)}
@media (min-width:600px){.modal{align-items:center}}
body.modal-open{overflow:hidden}
.icons{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-block:4px 12px}
.icons button{height:52px;border-radius:14px;border:2px solid var(--line);background:var(--surface-2);font-size:1.5rem;cursor:pointer}
.icons button.on{border-color:var(--brand);background:var(--brand-soft)}
.choice{display:flex;flex-direction:column;gap:8px;margin-block:4px 12px}
.choice button{text-align:start;min-height:52px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface-2);color:var(--text);font:inherit;font-weight:700;cursor:pointer}
.choice button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.plist{border:2px solid var(--line);border-radius:14px;max-height:260px;overflow:auto;margin-block:0 12px}
.plist label{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
.plist label:first-child{border-top:0}
.plist input{width:24px;height:24px;margin:0;flex:none;accent-color:var(--brand)}
.lbl{display:block;font-weight:700;margin-block:10px 6px}
</style>
<style>/* Rentals app: header under the see-through status bar; its content starts 20px lower, below the band iOS softens under the status bar */ .bar{padding-block-start:max(14px,calc(env(safe-area-inset-top) + 20px))}</style>
</head>
<body>
<header class="bar">
  <button id="backBtn" class="icon-btn hidden" type="button" aria-label="Back">&#x2039;</button>
  <h1 id="title">Maintenance</h1>
</header>
<div id="demoBanner" class="demo hidden">Demo mode: not connected. Changes stay in this browser.</div>
<main id="app"><div class="card"><span class="spin"></span> Loading&#x2026;</div></main>
<nav id="mtTabs" class="mttabs hidden" aria-label="Maintenance"></nav>
<div id="toast" class="toast hidden" role="status"></div>

<script src="../config.js?v=2026.10.17-2ed1937"></script>
<script src="../api.js?v=2026.10.17-2ed1937"></script>
<script src="../push.js?v=2026.10.17-2ed1937"></script>
<script src="app.js?v=2026.10.17-2ed1937"></script>
</body>
</html>
